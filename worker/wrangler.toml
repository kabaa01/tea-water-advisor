name = "tea-water-advisor"
main = "src/index.js"
compatibility_date = "2026-01-01"
# If your Cloudflare login has access to more than one account, uncomment
# and set this — it's the single most common cause of a GitHub Actions
# deploy failing while a local `wrangler deploy` succeeds (see README).
# account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"

[vars]
ALLOWED_ORIGIN = "https://kabaa01.github.io"
SITE_URL = "https://kabaa01.github.io/tea-water-advisor"
PRICE_USD_CENTS = "500"
PAYPAL_MODE = "live"
# Public PayPal Client ID from your REST API app at developer.paypal.com
# (safe to keep here — it is not sensitive, and appears in the page source anyway).
PAYPAL_CLIENT_ID = "YOUR_PAYPAL_CLIENT_ID"
# "Display Name <email@yourdomain.com>" — the domain must be verified in Resend.
# Leave as-is to skip sending confirmation emails.
RESEND_FROM_EMAIL = "Steep & Standard <receipts@YOUR-DOMAIN.com>"

# Secrets (do NOT put these here — set them with `wrangler secret put NAME`):
#   PAYPAL_CLIENT_SECRET     (from the same PayPal REST API app)
#   PAYPAL_WEBHOOK_ID        (optional — only if you configure a PayPal webhook)
#   RESEND_API_KEY           (optional — only if sending confirmation emails)
#   ADMIN_PASSWORD
#   ADMIN_TOKEN_SECRET
#   GOOGLE_SERVICE_ACCOUNT   (optional)
#   GOOGLE_SHEET_ID          (optional)
