name = "tea-water-advisor"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
ALLOWED_ORIGIN = "https://kabaa01.github.io"
SITE_URL = "https://kabaa01.github.io/tea-water-advisor"
PRICE_USD_CENTS = "500"
PAYPAL_MODE = "live"
# Public PayPal Client ID from your REST API app at developer.paypal.com
# (safe to keep here — it is not sensitive, and appears in the page source anyway).
PAYPAL_CLIENT_ID = "YOUR_PAYPAL_CLIENT_ID"

# Secrets (do NOT put these here — set them with `wrangler secret put NAME`):
#   PAYPAL_CLIENT_SECRET     (from the same PayPal REST API app)
#   PAYPAL_WEBHOOK_ID        (optional — only if you configure a PayPal webhook)
#   ADMIN_PASSWORD
#   ADMIN_TOKEN_SECRET
#   GOOGLE_SERVICE_ACCOUNT   (optional)
#   GOOGLE_SHEET_ID          (optional)
